<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e113a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Animated background elements */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes waveDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -400; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes barPulse {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.92); }
    }

    .ambient-orb {
      transform-origin: center;
      animation: pulseGlow 8s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: waveDash 20s linear infinite;
    }
    .pill-1 { animation: floatPill1 6s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 7s ease-in-out infinite; }
    .bar-anim { transform-origin: bottom; animation: barPulse 4s ease-in-out infinite; }
  </style>

  <!-- Base background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Ambient light blobs in background -->
  <circle cx="150" cy="80" r="180" fill="#38bdf8" opacity="0.1" filter="url(#glow)" class="ambient-orb" />
  <circle cx="1050" cy="280" r="220" fill="#c084fc" opacity="0.12" filter="url(#glow)" class="ambient-orb" />

  <!-- Technical Grid overlay -->
  <rect width="1200" height="360" fill="url(#cyberGrid)" />

  <!-- Background Dynamic Commerce Charts & Analytics Visuals (Layered behind text) -->
  <g opacity="0.45">
    <!-- Area Chart fill -->
    <path d="M 500 310 Q 620 230 750 260 T 950 180 T 1150 140 L 1150 340 L 500 340 Z" fill="url(#chartGrad)" />
    <!-- Line Chart stroke -->
    <path d="M 500 310 Q 620 230 750 260 T 950 180 T 1150 140" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 500 310 Q 620 230 750 260 T 950 180 T 1150 140" fill="none" stroke="#a855f7" stroke-width="1.5" class="flow-line" />
    
    <!-- Background Analytics Bar chart -->
    <rect x="760" y="220" width="16" height="110" rx="3" fill="url(#barGrad1)" class="bar-anim" />
    <rect x="790" y="190" width="16" height="140" rx="3" fill="url(#barGrad2)" class="bar-anim" />
    <rect x="820" y="240" width="16" height="90" rx="3" fill="url(#barGrad1)" class="bar-anim" />
    <rect x="850" y="160" width="16" height="170" rx="3" fill="url(#barGrad2)" class="bar-anim" />
    <rect x="880" y="200" width="16" height="130" rx="3" fill="url(#barGrad1)" class="bar-anim" />
    <rect x="910" y="140" width="16" height="190" rx="3" fill="url(#barGrad2)" class="bar-anim" />
    <rect x="940" y="170" width="16" height="160" rx="3" fill="url(#barGrad1)" class="bar-anim" />
  </g>

  <!-- Foreground Dynamic Metric Floating Pills (positioned away from title) -->
  <g class="pill-1" transform="translate(860, 48)">
    <rect width="180" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#10b981" />
    <text x="38" y="24" class="badge-text">📈 ROAS &amp; Attribution</text>
  </g>

  <g class="pill-2" transform="translate(980, 100)">
    <rect width="180" height="38" rx="19" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#a855f7" />
    <text x="38" y="24" class="badge-text">💎 LTV &amp; Cohort Intel</text>
  </g>

  <!-- Header / Badge above title -->
  <g transform="translate(80, 68)">
    <rect width="210" height="30" rx="15" fill="#3b82f6" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1" />
    <text x="18" y="20" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="1">⚡ CURATED ECOSYSTEM</text>
  </g>

  <!-- MAIN TITLE (Foreground, crystal-clear high contrast) -->
  <text x="80" y="152" fill="url(#primaryGrad)" class="title-text" filter="url(#glow)">Awesome E-Commerce Analytics</text>
  <text x="80" y="152" fill="#ffffff" class="title-text">Awesome E-Commerce Analytics</text>

  <!-- SUBTITLE (Foreground, high contrast) -->
  <text x="80" y="198" class="subtitle-text">Empowering Commerce with Multi-Touch Attribution, Customer LTV &amp; BI Intelligence</text>

  <!-- Feature Tags / Highlights at the bottom -->
  <g transform="translate(80, 248)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="16" y="22" class="badge-text">📊 Profit Analytics</text>
    
    <!-- Tag 2 -->
    <rect x="165" y="0" width="170" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="16" y="22" class="badge-text">🎯 First-Party Pixels</text>

    <!-- Tag 3 -->
    <rect x="350" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="16" y="22" class="badge-text">🔓 Open-Source Hubs</text>

    <!-- Tag 4 -->
    <rect x="530" y="0" width="155" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="16" y="22" class="badge-text">🤖 AI Data Agents</text>
  </g>
</svg>
